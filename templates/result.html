<!DOCTYPE html>

<html>

<head>

<title>Quiz Result</title>

<style>

body{

font-family:Arial;

background:#ECECEC;

}

.box{

width:500px;

margin:auto;

margin-top:100px;

background:white;

padding:30px;

text-align:center;

border-radius:10px;

box-shadow:0px 0px 10px gray;

}

a{

background:steelblue;

padding:10px 20px;

color:white;

text-decoration:none;

border-radius:8px;

}

</style>

</head>

<body>

<div class="box">

<h1>Quiz Finished</h1>

<h2>Hello {{ username }}</h2>

<h1>Your Score</h1>

<h2>Last Score : {{ last_score }}</h2>

<h2>Best Score : {{ best_score }}</h2>

<br>

<a href="/">Try Again</a>

</div>

</body>

</html>
